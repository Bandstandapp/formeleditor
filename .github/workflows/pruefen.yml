# Prüflauf mit neutralen Beispielformeln bei jedem Pull Request (Papas Formeln bleiben privat)
name: Formeln prüfen
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pruefen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node pruefen.mjs --bericht bericht.html
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pruefbericht
          path: tests/bericht.html
